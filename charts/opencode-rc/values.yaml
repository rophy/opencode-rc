profile: local  # or "production"

global:
  imageRegistry: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# How api, gateway and ui are exposed outside the cluster.
expose:
  # none | ingress | virtualService
  type: none
  # Base domain. Hosts are derived from the Helm release name:
  #   {release}.{host}       api + gateway (/tunnel -> gateway, everything else -> api)
  #   {release}-ui.{host}    web UI
  #   {release}-oidc.{host}  bundled oidc-mock (profile local only)
  host: ""
  # Scheme browsers and the CLI use to reach the hosts (TLS usually terminates at the edge).
  scheme: https
  ingress:
    className: ""
    annotations: {}
    # Optional TLS secret covering all hosts (e.g. a wildcard certificate).
    tlsSecretName: ""
  virtualService:
    # Existing Istio Gateways (namespace/name), required when type is virtualService.
    gateways: []
    annotations: {}
    # networking.istio.io/v1 needs Istio 1.22+; set networking.istio.io/v1beta1 for older Istio.
    apiVersion: networking.istio.io/v1

api:
  image:
    registry: ""
    repository: ghcr.io/rophy/opencode-rc/api
    tag: "0.6.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}
  # Browser-facing URL of the API (e.g. https://api.rc.example.com). Overrides the URL
  # derived from expose.*.
  publicUrl: ""
  service:
    type: ClusterIP
    nodePort: null

ui:
  # Serve the web UI from its own image and host. The API host never serves HTML.
  enabled: true
  image:
    registry: ""
    repository: ghcr.io/rophy/opencode-rc/ui
    tag: "0.5.0"
    pullPolicy: IfNotPresent
  # Browser-facing URL of the UI (e.g. https://rc.example.com). Overrides the URL derived
  # from expose.*.
  publicUrl: ""
  replicas: 1
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}
  service:
    type: ClusterIP
    nodePort: null

gateway:
  image:
    registry: ""
    repository: ghcr.io/rophy/opencode-rc/gateway
    tag: "0.6.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}

redis:
  enabled: true
  image:
    registry: ""
    repository: redis
    tag: "7.4.11-alpine"
    pullPolicy: IfNotPresent
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}

oidcMock:
  # External URL for oidc-mock (e.g. https://oidc-mock.corp.example.com). Defaults to
  # {expose.scheme}://{release}-oidc.{expose.host} when exposed, else the internal service URL.
  issuer: ""
  image:
    registry: ""
    repository: ghcr.io/rophy/oidc-mock
    tag: "20260913-34fdbaf"
    pullPolicy: IfNotPresent
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}

tlsInsecureSkipVerify: false

# Extra CA certificates to trust (PEM bundle). Multiple certs can be concatenated.
# Example:
#   extraCACerts: |
#     -----BEGIN CERTIFICATE-----
#     MIIDxTCC...
#     -----END CERTIFICATE-----
extraCACerts: ""

oidc:
  issuer: ""
  clientId: "opencode-rc"
  cliClientId: "opencode-rc-cli"
  redirectUri: ""
  # Override individual OIDC discovery endpoints (optional).
  # Useful when internal/external URLs differ (e.g. browser reaches external
  # authorization endpoint, server calls internal token endpoint).
  issuerOverride: ""
  authorizationEndpoint: ""
  tokenEndpoint: ""
  jwksUri: ""

auth:
  # Access token lifetime (<int>s|m|h|d)
  accessTokenTTL: "15m"
  # Absolute login lifetime; refresh never extends it
  sessionTTL: "7d"
  # Extra browser origins allowed for return_to and CORS, besides the server
  # itself. The mobile app's WebView origins (capacitor://localhost,
  # https://localhost) are always allowed for CORS only.
  allowedOrigins: []

secrets:
  # HMAC key for access tokens (64-char hex). Falls back to cookieSecret.
  tokenSecret: ""
  cookieSecret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  oidcClientSecret: "opencode-rc-secret"

existingSecret: ""
