profile: local  # or "production"

global:
  imageRegistry: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

web:
  image:
    registry: ""
    repository: ghcr.io/rophy/opencode-rc/web
    tag: "0.3.1"
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}
  service:
    type: ClusterIP
    nodePort: null
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []

gateway:
  image:
    registry: ""
    repository: ghcr.io/rophy/opencode-rc/gateway
    tag: "0.3.1"
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []

redis:
  enabled: true
  image:
    registry: ""
    repository: redis
    tag: "7.4.11-alpine"
    pullPolicy: IfNotPresent
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}

oidcMock:
  issuer: ""  # External URL for oidc-mock (e.g. https://oidc-mock.corp.example.com). Defaults to internal service URL.
  image:
    registry: ""
    repository: ghcr.io/rophy/oidc-mock
    tag: "20260913-34fdbaf"
    pullPolicy: IfNotPresent
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}

tlsInsecureSkipVerify: false

# Extra CA certificates to trust (PEM format). Each key becomes a cert file.
# Example:
#   extraCACerts:
#     internal-ca.crt: |
#       -----BEGIN CERTIFICATE-----
#       MIIDxTCC...
#       -----END CERTIFICATE-----
extraCACerts: {}

oidc:
  issuer: ""
  clientId: "opencode-rc"
  cliClientId: "opencode-rc-cli"
  redirectUri: ""
  cookieDomain: ""

secrets:
  cookieSecret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  oidcClientSecret: "opencode-rc-secret"

existingSecret: ""
