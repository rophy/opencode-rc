profile: local  # or "production"

global:
  imageRegistry: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

api:
  image:
    registry: ""
    repository: ghcr.io/rophy/opencode-rc/api
    tag: "0.6.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}
  service:
    type: ClusterIP
    nodePort: null
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []

ui:
  # Serve the web UI from its own image and host. The API host never serves HTML.
  enabled: true
  image:
    registry: ""
    repository: ghcr.io/rophy/opencode-rc/ui
    tag: "0.5.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}
  service:
    type: ClusterIP
    nodePort: null
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []

gateway:
  image:
    registry: ""
    repository: ghcr.io/rophy/opencode-rc/gateway
    tag: "0.6.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []

redis:
  enabled: true
  image:
    registry: ""
    repository: redis
    tag: "7.4.11-alpine"
    pullPolicy: IfNotPresent
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}

oidcMock:
  issuer: ""  # External URL for oidc-mock (e.g. https://oidc-mock.corp.example.com). Defaults to internal service URL.
  image:
    registry: ""
    repository: ghcr.io/rophy/oidc-mock
    tag: "20260913-34fdbaf"
    pullPolicy: IfNotPresent
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}

tlsInsecureSkipVerify: false

# Extra CA certificates to trust (PEM bundle). Multiple certs can be concatenated.
# Example:
#   extraCACerts: |
#     -----BEGIN CERTIFICATE-----
#     MIIDxTCC...
#     -----END CERTIFICATE-----
extraCACerts: ""

oidc:
  issuer: ""
  clientId: "opencode-rc"
  cliClientId: "opencode-rc-cli"
  redirectUri: ""
  # Override individual OIDC discovery endpoints (optional).
  # Useful when internal/external URLs differ (e.g. browser reaches external
  # authorization endpoint, server calls internal token endpoint).
  issuerOverride: ""
  authorizationEndpoint: ""
  tokenEndpoint: ""
  jwksUri: ""

auth:
  # Access token lifetime (<int>s|m|h|d)
  accessTokenTTL: "15m"
  # Absolute login lifetime; refresh never extends it
  sessionTTL: "7d"
  # Extra browser origins allowed for return_to and CORS, besides the server
  # itself and the mobile app (capacitor://localhost, https://localhost)
  allowedOrigins: []

secrets:
  # HMAC key for access tokens (64-char hex). Falls back to cookieSecret.
  tokenSecret: ""
  cookieSecret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  oidcClientSecret: "opencode-rc-secret"

existingSecret: ""
