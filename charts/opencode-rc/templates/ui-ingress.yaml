{{- if and .Values.ui.enabled .Values.ui.ingress.enabled }}
{{- include "opencode-rc.validateHosts" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opencode-rc.fullname" . }}-ui
  labels:
    {{- include "opencode-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- with .Values.ui.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ui.ingress.className }}
  ingressClassName: {{ .Values.ui.ingress.className }}
  {{- end }}
  {{- if .Values.ui.ingress.tls }}
  tls:
    {{- toYaml .Values.ui.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ui.ingress.host is required when ui.ingress.enabled is true" .Values.ui.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "opencode-rc.fullname" . }}-ui
                port:
                  number: 8080
{{- end }}
