{{- include "opencode-rc.validateProduction" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencode-rc.fullname" . }}-gateway
  labels:
    {{- include "opencode-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "opencode-rc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "opencode-rc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
        {{- with .Values.gateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.gateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "opencode-rc.image" (dict "image" .Values.gateway.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: PORT
              value: "9090"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OIDC_ISSUER
              value: {{ include "opencode-rc.oidcIssuer" . | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode-rc.secretName" . }}
                  key: oidc-client-secret
            - name: OIDC_REDIRECT_URI
              value: {{ include "opencode-rc.redirectUri" . | quote }}
            - name: OIDC_CLI_CLIENT_ID
              value: {{ .Values.oidc.cliClientId | quote }}
            {{- if .Values.oidc.issuerOverride }}
            - name: OIDC_ISSUER_OVERRIDE
              value: {{ .Values.oidc.issuerOverride | quote }}
            {{- end }}
            {{- if .Values.oidc.authorizationEndpoint }}
            - name: OIDC_AUTHORIZATION_ENDPOINT
              value: {{ .Values.oidc.authorizationEndpoint | quote }}
            {{- end }}
            {{- if .Values.oidc.tokenEndpoint }}
            - name: OIDC_TOKEN_ENDPOINT
              value: {{ .Values.oidc.tokenEndpoint | quote }}
            {{- end }}
            {{- if .Values.oidc.jwksUri }}
            - name: OIDC_JWKS_URI
              value: {{ .Values.oidc.jwksUri | quote }}
            {{- end }}
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode-rc.secretName" . }}
                  key: cookie-secret
            - name: COOKIE_SECURE
              value: {{ if eq .Values.profile "production" }}"true"{{ else }}"false"{{ end }}
            {{- if .Values.tlsInsecureSkipVerify }}
            - name: TLS_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- if .Values.extraCACerts }}
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/extra/ca-bundle.crt"
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: {{ include "opencode-rc.redisUrl" . | quote }}
            {{- else }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode-rc.secretName" . }}
                  key: redis-url
            {{- end }}
          {{- with .Values.gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.extraCACerts }}
          volumeMounts:
            - name: extra-ca-certs
              mountPath: /etc/ssl/certs/extra
              readOnly: true
          {{- end }}
          {{- with .Values.gateway.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.extraCACerts }}
      volumes:
        - name: extra-ca-certs
          configMap:
            name: {{ include "opencode-rc.fullname" . }}-extra-ca-certs
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
