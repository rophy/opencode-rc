apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencode-rc.fullname" . }}-gateway
  labels:
    {{- include "opencode-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "opencode-rc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "opencode-rc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
        {{- with .Values.gateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.gateway.podAnnotations .Values.config }}
      annotations:
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.config }}
        # The gateway reads the config once at startup.
        checksum/config: {{ toJson .Values.config | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "opencode-rc.image" (dict "image" .Values.gateway.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: PORT
              value: "9090"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OIDC_ISSUER
              value: {{ include "opencode-rc.oidcDiscoveryIssuer" . | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ include "opencode-rc.oidcClientId" . | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode-rc.secretName" . }}
                  key: oidc-client-secret
            - name: OIDC_REDIRECT_URI
              value: {{ include "opencode-rc.redirectUri" . | quote }}
            - name: OIDC_CLI_CLIENT_ID
              value: {{ include "opencode-rc.oidcCliClientId" . | quote }}
            - name: OIDC_USER_CLAIM
              value: {{ .Values.oidc.userClaim | default "sub" | quote }}
            {{- with include "opencode-rc.oidcOverrideEnv" . }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            - name: TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode-rc.secretName" . }}
                  key: cookie-secret
            {{- if .Values.tlsInsecureSkipVerify }}
            - name: TLS_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- if .Values.extraCACerts }}
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/extra/ca-bundle.crt"
            {{- end }}
            {{- if .Values.config }}
            - name: OPENCODE_RC_CONFIG
              value: /etc/opencode-rc/config.json
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: {{ include "opencode-rc.redisUrl" . | quote }}
            {{- else }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode-rc.secretName" . }}
                  key: redis-url
            {{- end }}
          {{- with .Values.gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.extraCACerts .Values.config }}
          volumeMounts:
            {{- if .Values.extraCACerts }}
            - name: extra-ca-certs
              mountPath: /etc/ssl/certs/extra
              readOnly: true
            {{- end }}
            {{- if .Values.config }}
            - name: config
              mountPath: /etc/opencode-rc
              readOnly: true
            {{- end }}
          {{- end }}
          {{- with .Values.gateway.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.extraCACerts .Values.config }}
      volumes:
        {{- if .Values.extraCACerts }}
        - name: extra-ca-certs
          configMap:
            name: {{ include "opencode-rc.fullname" . }}-extra-ca-certs
        {{- end }}
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "opencode-rc.fullname" . }}-api-config
        {{- end }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
