{{- if .Values.gateway.ingress.enabled }}
{{- $defaultAnnotations := dict
  "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600"
  "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600"
-}}
{{- $annotations := merge (.Values.gateway.ingress.annotations | default dict) $defaultAnnotations -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opencode-rc.fullname" . }}-gateway
  labels:
    {{- include "opencode-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- if .Values.gateway.ingress.className }}
  ingressClassName: {{ .Values.gateway.ingress.className }}
  {{- end }}
  {{- if .Values.gateway.ingress.tls }}
  tls:
    {{- toYaml .Values.gateway.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.gateway.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "opencode-rc.fullname" . }}-gateway
                port:
                  number: 9090
{{- end }}
