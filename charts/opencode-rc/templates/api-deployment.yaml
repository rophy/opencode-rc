{{- include "opencode-rc.validateNoLegacyWeb" . -}}
{{- include "opencode-rc.validateExpose" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencode-rc.fullname" . }}-api
  labels:
    {{- include "opencode-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "opencode-rc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "opencode-rc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.api.podAnnotations .Values.config }}
      annotations:
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.config }}
        # The API reads its config once at startup.
        checksum/config: {{ toJson .Values.config | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "opencode-rc.image" (dict "image" .Values.api.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: OIDC_ISSUER
              value: {{ include "opencode-rc.oidcDiscoveryIssuer" . | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ include "opencode-rc.oidcClientId" . | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode-rc.secretName" . }}
                  key: oidc-client-secret
            - name: OIDC_REDIRECT_URI
              value: {{ include "opencode-rc.redirectUri" . | quote }}
            - name: OIDC_CLI_CLIENT_ID
              value: {{ include "opencode-rc.oidcCliClientId" . | quote }}
            - name: OIDC_USER_CLAIM
              value: {{ .Values.oidc.userClaim | default "sub" | quote }}
            - name: TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode-rc.secretName" . }}
                  key: cookie-secret
            - name: COOKIE_SECURE
              value: {{ include "opencode-rc.cookieSecure" . | quote }}
            {{- $auth := .Values.auth | default dict }}
            - name: ACCESS_TOKEN_TTL
              value: {{ dig "accessTokenTTL" "15m" $auth | quote }}
            - name: SESSION_TTL
              value: {{ dig "sessionTTL" "7d" $auth | quote }}
            - name: APP_LOGIN_PROMPT
              value: {{ dig "appLoginPrompt" "select_account" $auth | quote }}
            {{- $origins := dig "allowedOrigins" list $auth }}
            {{- if .Values.ui.enabled }}
            {{- $origins = prepend $origins (include "opencode-rc.uiPublicUrl" .) }}
            {{- end }}
            {{- with $origins }}
            - name: ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with include "opencode-rc.oidcOverrideEnv" . }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            {{- if .Values.tlsInsecureSkipVerify }}
            - name: TLS_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- if .Values.extraCACerts }}
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/ssl/certs/extra/ca-bundle.crt"
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: {{ include "opencode-rc.redisUrl" . | quote }}
            {{- else }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode-rc.secretName" . }}
                  key: redis-url
            {{- end }}
            - name: GATEWAY_URL
              value: "http://{{ include "opencode-rc.fullname" . }}-gateway:9090"
            {{- if .Values.config }}
            - name: OPENCODE_RC_CONFIG
              value: /etc/opencode-rc/config.json
            {{- end }}
            {{- $authz := .Values.authz | default dict }}
            {{- with dig "webhook" "url" "" $authz }}
            - name: AUTHZ_WEBHOOK_URL
              value: {{ . | quote }}
            - name: AUTHZ_TIMEOUT
              value: {{ dig "timeout" "5s" $authz | quote }}
            - name: AUTHZ_CACHE_TTL_ALLOWED
              value: {{ dig "cacheTTL" "allowed" "60s" $authz | quote }}
            - name: AUTHZ_CACHE_TTL_DENIED
              value: {{ dig "cacheTTL" "denied" "10s" $authz | quote }}
            {{- end }}
            {{- with dig "webhook" "tokenSecret" "name" "" $authz }}
            - name: AUTHZ_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ dig "webhook" "tokenSecret" "key" "token" $authz }}
            {{- end }}
            {{- $admin := .Values.admin | default dict }}
            {{- with dig "tokenSecret" "name" "" $admin }}
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ dig "tokenSecret" "key" "token" $admin }}
            {{- end }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.extraCACerts .Values.config }}
          volumeMounts:
            {{- if .Values.extraCACerts }}
            - name: extra-ca-certs
              mountPath: /etc/ssl/certs/extra
              readOnly: true
            {{- end }}
            {{- if .Values.config }}
            - name: config
              mountPath: /etc/opencode-rc
              readOnly: true
            {{- end }}
          {{- end }}
          {{- with .Values.api.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.extraCACerts .Values.config }}
      volumes:
        {{- if .Values.extraCACerts }}
        - name: extra-ca-certs
          configMap:
            name: {{ include "opencode-rc.fullname" . }}-extra-ca-certs
        {{- end }}
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "opencode-rc.fullname" . }}-api-config
        {{- end }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
