apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode-rc.fullname" . }}-api
  labels:
    {{- include "opencode-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type | default "ClusterIP" }}
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq (.Values.api.service.type | default "ClusterIP") "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
  selector:
    {{- include "opencode-rc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
