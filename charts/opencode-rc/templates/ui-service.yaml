{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode-rc.fullname" . }}-ui
  labels:
    {{- include "opencode-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type | default "ClusterIP" }}
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq (.Values.ui.service.type | default "ClusterIP") "NodePort") .Values.ui.service.nodePort }}
      nodePort: {{ .Values.ui.service.nodePort }}
      {{- end }}
  selector:
    {{- include "opencode-rc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}
