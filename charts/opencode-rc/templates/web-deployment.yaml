{{- include "opencode-rc.validateProduction" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencode-rc.fullname" . }}-web
  labels:
    {{- include "opencode-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "opencode-rc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "opencode-rc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
        {{- with .Values.web.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "opencode-rc.image" (dict "image" .Values.web.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          args: ["web"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: OIDC_ISSUER
              value: {{ include "opencode-rc.oidcIssuer" . | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode-rc.secretName" . }}
                  key: oidc-client-secret
            - name: OIDC_REDIRECT_URI
              value: {{ include "opencode-rc.redirectUri" . | quote }}
            - name: OIDC_CLI_CLIENT_ID
              value: {{ .Values.oidc.cliClientId | quote }}
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode-rc.secretName" . }}
                  key: cookie-secret
            - name: COOKIE_SECURE
              value: {{ if eq .Values.profile "production" }}"true"{{ else }}"false"{{ end }}
            {{- if .Values.oidc.cookieDomain }}
            - name: COOKIE_DOMAIN
              value: {{ .Values.oidc.cookieDomain | quote }}
            {{- end }}
            {{- if .Values.tlsInsecureSkipVerify }}
            - name: TLS_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- if .Values.extraCACerts }}
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/etc/ssl/certs/extra"
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: {{ include "opencode-rc.redisUrl" . | quote }}
            {{- else }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode-rc.secretName" . }}
                  key: redis-url
            {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.extraCACerts }}
          volumeMounts:
            - name: extra-ca-certs
              mountPath: /etc/ssl/certs/extra
              readOnly: true
          {{- end }}
          {{- with .Values.web.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.extraCACerts }}
      volumes:
        - name: extra-ca-certs
          configMap:
            name: {{ include "opencode-rc.fullname" . }}-extra-ca-certs
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
