{{- if eq (include "opencode-rc.exposeType" .) "virtualService" }}
{{- $fullname := include "opencode-rc.fullname" . }}
apiVersion: {{ .Values.expose.virtualService.apiVersion | default "networking.istio.io/v1" }}
kind: VirtualService
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "opencode-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.expose.virtualService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hosts:
    - {{ include "opencode-rc.apiHost" . }}
  gateways:
    {{- toYaml .Values.expose.virtualService.gateways | nindent 4 }}
  http:
    # Istio route timeouts are disabled by default, so the long-lived CLI tunnel, SSE streams
    # and terminal WebSockets need no timeout override (and `timeout: 0s` is rejected by
    # Istio before 1.22).
    - match:
        - uri:
            exact: /tunnel
      route:
        - destination:
            host: {{ $fullname }}-gateway
            port:
              number: 9090
    - route:
        - destination:
            host: {{ $fullname }}-api
            port:
              number: 8080
{{- if .Values.ui.enabled }}
---
apiVersion: {{ .Values.expose.virtualService.apiVersion | default "networking.istio.io/v1" }}
kind: VirtualService
metadata:
  name: {{ $fullname }}-ui
  labels:
    {{- include "opencode-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- with .Values.expose.virtualService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hosts:
    - {{ include "opencode-rc.uiHost" . }}
  gateways:
    {{- toYaml .Values.expose.virtualService.gateways | nindent 4 }}
  http:
    - route:
        - destination:
            host: {{ $fullname }}-ui
            port:
              number: 8080
{{- end }}
{{- if include "opencode-rc.oidcMockExposed" . }}
---
apiVersion: {{ .Values.expose.virtualService.apiVersion | default "networking.istio.io/v1" }}
kind: VirtualService
metadata:
  name: {{ $fullname }}-oidc-mock
  labels:
    {{- include "opencode-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: oidc-mock
  {{- with .Values.expose.virtualService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hosts:
    - {{ include "opencode-rc.oidcMockHost" . }}
  gateways:
    {{- toYaml .Values.expose.virtualService.gateways | nindent 4 }}
  http:
    - route:
        - destination:
            host: {{ $fullname }}-oidc-mock
            port:
              number: 8080
{{- end }}
{{- end }}
