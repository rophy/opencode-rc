suite: gateway deployment
templates:
  - templates/gateway-deployment.yaml
tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-gateway
      - isNull:
          path: spec.template.spec.containers[0].args
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/rophy/opencode-rc/gateway:0.7.1"
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9090
            name: http

  - it: sets POD_IP from downward API
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP

  - it: uses global imageRegistry
    set:
      global.imageRegistry: harbor.corp.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "harbor.corp.example.com/ghcr.io/rophy/opencode-rc/gateway:0.7.1"

  - it: reads secrets from existingSecret
    set:
      oidcMock.enabled: false
      existingSecret: corp-secrets
      oidc.issuer: https://idp.corp.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOKEN_SECRET
            valueFrom:
              secretKeyRef:
                name: corp-secrets
                key: cookie-secret

  - it: applies tolerations
    set:
      gateway.tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "gateway"
          effect: "NoSchedule"
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated

  - it: applies resources
    set:
      gateway.resources:
        requests:
          cpu: 200m
          memory: 256Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 200m

  - it: applies podAnnotations
    set:
      gateway.podAnnotations:
        sidecar.istio.io/inject: "false"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "false"

  - it: does not set OIDC override env vars by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_OVERRIDE
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_AUTHORIZATION_ENDPOINT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_TOKEN_ENDPOINT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_JWKS_URI

  - it: sets OIDC override env vars when configured
    set:
      oidc.issuerOverride: https://external.idp.example.com
      oidc.authorizationEndpoint: https://external.idp.example.com/authorize
      oidc.tokenEndpoint: https://internal.idp.example.com/token
      oidc.jwksUri: https://internal.idp.example.com/jwks
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_OVERRIDE
            value: "https://external.idp.example.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_AUTHORIZATION_ENDPOINT
            value: "https://external.idp.example.com/authorize"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_TOKEN_ENDPOINT
            value: "https://internal.idp.example.com/token"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_JWKS_URI
            value: "https://internal.idp.example.com/jwks"

  - it: sets only specified OIDC overrides
    set:
      oidc.tokenEndpoint: https://internal.idp.example.com/token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_TOKEN_ENDPOINT
            value: "https://internal.idp.example.com/token"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_OVERRIDE
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_AUTHORIZATION_ENDPOINT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_JWKS_URI

  - it: does not set TLS_INSECURE_SKIP_VERIFY by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_INSECURE_SKIP_VERIFY
            value: "true"

  - it: sets TLS_INSECURE_SKIP_VERIFY when enabled
    set:
      tlsInsecureSkipVerify: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_INSECURE_SKIP_VERIFY
            value: "true"

  - it: does not mount extra CA certs by default
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
      - isNull:
          path: spec.template.spec.volumes

  - it: mounts extra CA certs and sets SSL_CERT_FILE
    set:
      extraCACerts: "-----BEGIN CERTIFICATE-----\ntest\n-----END CERTIFICATE-----"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_FILE
            value: "/etc/ssl/certs/extra/ca-bundle.crt"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-ca-certs
            mountPath: /etc/ssl/certs/extra
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-ca-certs
            configMap:
              name: RELEASE-NAME-opencode-rc-extra-ca-certs

  - it: does not set cookie env vars
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: COOKIE_SECURE
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: COOKIE_DOMAIN
          any: true

  - it: discovers the exposed oidc-mock in-cluster and accepts its external issuer
    set:
      expose.type: ingress
      expose.host: example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER
            value: http://RELEASE-NAME-opencode-rc-oidc-mock:8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_OVERRIDE
            value: https://RELEASE-NAME-oidc.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_AUTHORIZATION_ENDPOINT
            value: https://RELEASE-NAME-oidc.example.com/authorize
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_TOKEN_ENDPOINT
            value: http://RELEASE-NAME-opencode-rc-oidc-mock:8080/token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_JWKS_URI
            value: http://RELEASE-NAME-opencode-rc-oidc-mock:8080/jwks

  - it: a configured issuer with expose uses no overrides
    set:
      oidcMock.enabled: false
      existingSecret: corp-secrets
      oidc.issuer: https://idp.corp.example.com
      expose.type: ingress
      expose.host: example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER
            value: https://idp.corp.example.com
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_OVERRIDE
          any: true

  - it: takes client ids from the mock when oidc.* is empty
    set:
      oidcMock.clients.web.id: mock-web
      oidcMock.clients.cli.id: mock-cli
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OIDC_CLIENT_ID, value: mock-web}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OIDC_CLI_CLIENT_ID, value: mock-cli}

  - it: keys users by sub by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OIDC_USER_CLAIM, value: sub}

  - it: passes oidc.userClaim
    set:
      oidc.userClaim: oid
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OIDC_USER_CLAIM, value: oid}

  - it: mounts the deployment config and points the gateway at it when config is set
    set:
      config:
        opencodeV2:
          versions:
            min: "2.0.26"
            max: "2.0.27"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENCODE_RC_CONFIG
            value: /etc/opencode-rc/config.json
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/opencode-rc
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: RELEASE-NAME-opencode-rc-api-config
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: has no config env or mount when config is unset
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENCODE_RC_CONFIG
            value: /etc/opencode-rc/config.json
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
      - isNull:
          path: spec.template.spec.volumes
      - isNull:
          path: spec.template.metadata.annotations

  - it: keeps extra CA certs alongside the config
    set:
      extraCACerts: "x"
      config:
        features: {}
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 2
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 2
