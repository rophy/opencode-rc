suite: gateway deployment
templates:
  - templates/gateway-deployment.yaml
tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-gateway
      - isNull:
          path: spec.template.spec.containers[0].args
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/rophy/opencode-rc/gateway:0.2.0"
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9090
            name: http

  - it: sets POD_IP from downward API
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP

  - it: uses global imageRegistry
    set:
      global.imageRegistry: harbor.corp.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "harbor.corp.example.com/ghcr.io/rophy/opencode-rc/gateway:0.2.0"

  - it: reads secrets from existingSecret in production
    set:
      profile: production
      existingSecret: corp-secrets
      oidc.issuer: https://idp.corp.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: corp-secrets
                key: cookie-secret

  - it: applies tolerations
    set:
      gateway.tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "gateway"
          effect: "NoSchedule"
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated

  - it: applies resources
    set:
      gateway.resources:
        requests:
          cpu: 200m
          memory: 256Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 200m

  - it: applies podAnnotations
    set:
      gateway.podAnnotations:
        sidecar.istio.io/inject: "false"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "false"

  - it: does not set TLS_INSECURE_SKIP_VERIFY by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_INSECURE_SKIP_VERIFY
            value: "true"

  - it: sets TLS_INSECURE_SKIP_VERIFY when enabled
    set:
      tlsInsecureSkipVerify: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_INSECURE_SKIP_VERIFY
            value: "true"

  - it: does not mount extra CA certs by default
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
      - isNull:
          path: spec.template.spec.volumes

  - it: mounts extra CA certs and sets SSL_CERT_DIR
    set:
      extraCACerts:
        internal-ca.crt: "-----BEGIN CERTIFICATE-----\ntest\n-----END CERTIFICATE-----"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_DIR
            value: "/etc/ssl/certs:/etc/ssl/certs/extra"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-ca-certs
            mountPath: /etc/ssl/certs/extra
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-ca-certs
            configMap:
              name: RELEASE-NAME-opencode-rc-extra-ca-certs
