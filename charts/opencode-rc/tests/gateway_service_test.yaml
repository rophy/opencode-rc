suite: gateway service
templates:
  - templates/gateway-service.yaml
tests:
  - it: renders ClusterIP service on port 8080
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            port: 8080
            targetPort: http
            protocol: TCP
            name: http
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-gateway
