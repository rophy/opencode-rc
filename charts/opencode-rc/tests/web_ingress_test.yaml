suite: web ingress
templates:
  - templates/web-ingress.yaml
tests:
  - it: is disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders when enabled with host
    set:
      web.ingress.enabled: true
      web.ingress.host: opencode.corp.example.com
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].host
          value: opencode.corp.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-opencode-rc-web
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080

  - it: sets ingressClassName
    set:
      web.ingress.enabled: true
      web.ingress.host: opencode.corp.example.com
      web.ingress.className: nginx
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: applies annotations
    set:
      web.ingress.enabled: true
      web.ingress.host: opencode.corp.example.com
      web.ingress.annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-body-size"]
          value: "10m"

  - it: configures TLS
    set:
      web.ingress.enabled: true
      web.ingress.host: opencode.corp.example.com
      web.ingress.tls:
        - secretName: opencode-tls
          hosts:
            - opencode.corp.example.com
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: opencode-tls
