suite: virtualservice
templates:
  - templates/virtualservice.yaml
set:
  expose.type: virtualService
  expose.host: example.com
  expose.virtualService.gateways: [istio-system/public-gw]
tests:
  - it: is not rendered when expose.type is none
    set:
      expose.type: none
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered when expose.type is ingress
    set:
      expose.type: ingress
    asserts:
      - hasDocuments:
          count: 0

  - it: renders api, ui and oidc-mock VirtualServices in the local profile
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: VirtualService
      - isAPIVersion:
          of: networking.istio.io/v1

  - it: routes /tunnel to the gateway, /proxy/ and the rest to the api, in that order
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-api
      - equal:
          path: spec.hosts
          value: [RELEASE-NAME.example.com]
      - equal:
          path: spec.gateways
          value: [istio-system/public-gw]
      - equal:
          path: spec.http
          value:
            - match:
                - uri:
                    exact: /tunnel
              route:
                - destination:
                    host: RELEASE-NAME-opencode-rc-gateway
                    port:
                      number: 9090
              timeout: 0s
            - match:
                - uri:
                    prefix: /proxy/
              route:
                - destination:
                    host: RELEASE-NAME-opencode-rc-api
                    port:
                      number: 8080
              timeout: 0s
            - route:
                - destination:
                    host: RELEASE-NAME-opencode-rc-api
                    port:
                      number: 8080

  - it: routes the ui host to the ui service
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-ui
      - equal:
          path: spec.hosts
          value: [RELEASE-NAME-ui.example.com]
      - equal:
          path: spec.gateways
          value: [istio-system/public-gw]
      - equal:
          path: spec.http
          value:
            - route:
                - destination:
                    host: RELEASE-NAME-opencode-rc-ui
                    port:
                      number: 8080

  - it: routes the oidc-mock host to the oidc-mock service
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-oidc-mock
      - equal:
          path: spec.hosts
          value: [RELEASE-NAME-oidc.example.com]
      - equal:
          path: spec.gateways
          value: [istio-system/public-gw]
      - equal:
          path: spec.http
          value:
            - route:
                - destination:
                    host: RELEASE-NAME-opencode-rc-oidc-mock
                    port:
                      number: 8080

  - it: renders only the api VirtualService with ui disabled in production
    set:
      ui.enabled: false
      profile: production
      existingSecret: corp-secrets
      oidc.issuer: https://idp.corp.example.com
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-api

  - it: omits the oidc-mock VirtualService in production
    set:
      profile: production
      existingSecret: corp-secrets
      oidc.issuer: https://idp.corp.example.com
    asserts:
      - hasDocuments:
          count: 2
      - notEqual:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-oidc-mock

  - it: applies annotations
    set:
      expose.virtualService.annotations:
        team: platform
    asserts:
      - equal:
          path: metadata.annotations.team
          value: platform
