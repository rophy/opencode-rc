suite: virtualservice
templates:
  - templates/virtualservice.yaml
set:
  expose.type: virtualService
  expose.host: example.com
  expose.virtualService.gateways: [istio-system/public-gw]
tests:
  - it: is not rendered when expose.type is none
    set:
      expose.type: none
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered when expose.type is ingress
    set:
      expose.type: ingress
    asserts:
      - hasDocuments:
          count: 0

  - it: renders api, ui and oidc-mock VirtualServices
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: VirtualService
      - isAPIVersion:
          of: networking.istio.io/v1

  - it: uses expose.virtualService.apiVersion for every VirtualService (older Istio)
    set:
      expose.virtualService.apiVersion: networking.istio.io/v1beta1
    asserts:
      - hasDocuments:
          count: 3
      - isAPIVersion:
          of: networking.istio.io/v1beta1

  - it: routes /tunnel to the gateway and the rest to the api, with no route timeout
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-api
      - equal:
          path: spec.hosts
          value: [RELEASE-NAME.example.com]
      - equal:
          path: spec.gateways
          value: [istio-system/public-gw]
      - equal:
          path: spec.http
          value:
            - match:
                - uri:
                    exact: /tunnel
              route:
                - destination:
                    host: RELEASE-NAME-opencode-rc-gateway
                    port:
                      number: 9090
            - route:
                - destination:
                    host: RELEASE-NAME-opencode-rc-api
                    port:
                      number: 8080

  - it: routes the ui host to the ui service
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-ui
      - equal:
          path: spec.hosts
          value: [RELEASE-NAME-ui.example.com]
      - equal:
          path: spec.gateways
          value: [istio-system/public-gw]
      - equal:
          path: spec.http
          value:
            - route:
                - destination:
                    host: RELEASE-NAME-opencode-rc-ui
                    port:
                      number: 8080

  - it: routes the oidc-mock host to the oidc-mock service
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-oidc-mock
      - equal:
          path: spec.hosts
          value: [RELEASE-NAME-oidc.example.com]
      - equal:
          path: spec.gateways
          value: [istio-system/public-gw]
      - equal:
          path: spec.http
          value:
            - route:
                - destination:
                    host: RELEASE-NAME-opencode-rc-oidc-mock
                    port:
                      number: 8080

  - it: renders only the api VirtualService with ui and oidcMock disabled
    set:
      ui.enabled: false
      oidcMock.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-api

  - it: omits the oidc-mock VirtualService when oidcMock is disabled
    set:
      oidcMock.enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - notEqual:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-oidc-mock

  - it: keeps the oidc-mock VirtualService when oidc.issuer is set
    set:
      oidc.issuer: https://idp.corp.example.com
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-oidc-mock
        documentIndex: 2

  - it: applies annotations
    set:
      expose.virtualService.annotations:
        team: platform
    asserts:
      - equal:
          path: metadata.annotations.team
          value: platform

  - it: derives hosts from expose.hostPrefix
    set:
      expose.hostPrefix: code
    asserts:
      - equal:
          path: spec.hosts
          value: [code.example.com]
        documentIndex: 0
      - equal:
          path: spec.hosts
          value: [code-ui.example.com]
        documentIndex: 1
      - equal:
          path: spec.hosts
          value: [code-oidc.example.com]
        documentIndex: 2
