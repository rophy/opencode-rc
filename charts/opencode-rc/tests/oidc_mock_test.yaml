suite: oidc mock
templates:
  - templates/oidc-mock-deployment.yaml
  - templates/oidc-mock-service.yaml
  - templates/oidc-mock-configmap.yaml
tests:
  - it: creates deployment by default
    template: templates/oidc-mock-deployment.yaml
    set:
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-oidc-mock
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/rophy/oidc-mock:20260913-34fdbaf"
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["serve"]

  - it: is absent when oidcMock is disabled
    template: templates/oidc-mock-deployment.yaml
    set:
      oidcMock.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: creates service by default
    template: templates/oidc-mock-service.yaml
    set:
    asserts:
      - isKind:
          of: Service
      - contains:
          path: spec.ports
          content:
            port: 8080
            targetPort: http
            protocol: TCP
            name: http

  - it: service absent when oidcMock is disabled
    template: templates/oidc-mock-service.yaml
    set:
      oidcMock.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: creates configmap with OIDC config
    template: templates/oidc-mock-configmap.yaml
    set:
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "id: opencode-rc"
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "id: opencode-rc-cli"
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "alice@example.com"

  - it: configmap absent when oidcMock is disabled
    template: templates/oidc-mock-configmap.yaml
    set:
      oidcMock.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses global imageRegistry
    template: templates/oidc-mock-deployment.yaml
    set:
      global.imageRegistry: harbor.corp.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "harbor.corp.example.com/ghcr.io/rophy/oidc-mock:20260913-34fdbaf"

  - it: applies tolerations
    template: templates/oidc-mock-deployment.yaml
    set:
      oidcMock.tolerations:
        - key: "test"
          operator: "Exists"
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: test

  - it: uses the in-cluster issuer when not exposed
    template: templates/oidc-mock-configmap.yaml
    asserts:
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "issuer: http://RELEASE-NAME-opencode-rc-oidc-mock:8080\n"

  - it: uses the exposed oidc host as issuer and the exposed api for the redirect URI
    template: templates/oidc-mock-configmap.yaml
    set:
      expose.type: ingress
      expose.host: example.com
    asserts:
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "issuer: https://RELEASE-NAME-oidc.example.com\n"
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "- https://RELEASE-NAME.example.com/auth/callback\n"

  - it: an explicit oidcMock.issuer wins over the exposed oidc host
    template: templates/oidc-mock-configmap.yaml
    set:
      expose.type: ingress
      expose.host: example.com
      oidcMock.issuer: https://oidc-mock.corp.example.com
    asserts:
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "issuer: https://oidc-mock.corp.example.com\n"

  - it: advertises its exposed host even when oidc.issuer is set
    template: templates/oidc-mock-configmap.yaml
    set:
      expose.type: ingress
      expose.host: example.com
      oidc.issuer: https://idp.corp.example.com
    asserts:
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "issuer: https://RELEASE-NAME-oidc.example.com\n"

  - it: builds clients and users from oidcMock values only
    template: templates/oidc-mock-configmap.yaml
    set:
      oidcMock.clients.web.id: mock-web
      oidcMock.clients.web.secret: mock-secret
      oidcMock.clients.web.redirectUris: [https://a.example.com/cb, https://b.example.com/cb]
      oidcMock.clients.cli.id: mock-cli
      oidcMock.users: [{sub: u9, email: carol@example.com, name: Carol, password: pw}]
      oidc.clientId: ignored-web
      oidc.cliClientId: ignored-cli
      oidc.redirectUri: https://ignored.example.com/cb
      secrets.oidcClientSecret: ignored-secret
    asserts:
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "- id: mock-web\n    secret: mock-secret\n    redirect_uris:\n      - https://a.example.com/cb\n      - https://b.example.com/cb\n"
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "- id: mock-cli\n    redirect_uris:\n      - http://127.0.0.1/callback\n"
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "carol@example.com"
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "password: pw"
      - notMatchRegex:
          path: data["oidc-config.yaml"]
          pattern: "ignored|alice@example.com"

  - it: defaults the web client redirect URI to the API callback, ignoring oidc.redirectUri
    template: templates/oidc-mock-configmap.yaml
    set:
      api.publicUrl: https://api.example.com
      oidc.redirectUri: https://ignored.example.com/cb
    asserts:
      - matchRegex:
          path: data["oidc-config.yaml"]
          pattern: "- https://api.example.com/auth/callback\n"
