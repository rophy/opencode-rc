suite: tunneler service
templates:
  - templates/tunneler-service.yaml
tests:
  - it: renders ClusterIP service on port 9090
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            port: 9090
            targetPort: http
            protocol: TCP
            name: http
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-tunneler
