suite: redis
templates:
  - templates/redis-statefulset.yaml
  - templates/redis-service.yaml
tests:
  - it: creates StatefulSet when enabled
    template: templates/redis-statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-redis
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["redis-server", "--save", ""]
      - equal:
          path: spec.template.spec.containers[0].image
          value: "redis:7.4.11-alpine"

  - it: uses global imageRegistry for Redis
    template: templates/redis-statefulset.yaml
    set:
      global.imageRegistry: harbor.corp.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "harbor.corp.example.com/redis:7.4.11-alpine"

  - it: is absent when disabled
    template: templates/redis-statefulset.yaml
    set:
      redis.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: creates service when enabled
    template: templates/redis-service.yaml
    asserts:
      - isKind:
          of: Service
      - contains:
          path: spec.ports
          content:
            port: 6379
            targetPort: redis
            protocol: TCP
            name: redis

  - it: service absent when disabled
    template: templates/redis-service.yaml
    set:
      redis.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: applies tolerations
    template: templates/redis-statefulset.yaml
    set:
      redis.tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "redis"
          effect: "NoSchedule"
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated

  - it: applies resources
    template: templates/redis-statefulset.yaml
    set:
      redis.resources:
        requests:
          cpu: 50m
          memory: 64Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m
