suite: api config
templates:
  - templates/api-configmap.yaml
tests:
  - it: is not rendered without config
    asserts:
      - hasDocuments:
          count: 0

  - it: renders config as JSON
    set:
      config:
        features:
          uploads:
            enabled: false
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-api-config
      - equal:
          path: data["config.json"]
          value: '{"features":{"uploads":{"enabled":false}}}'
