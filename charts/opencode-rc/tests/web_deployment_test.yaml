suite: web deployment
templates:
  - templates/web-deployment.yaml
values:
  - ../values.yaml
tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-web
      - equal:
          path: spec.replicas
          value: 1
      - isNull:
          path: spec.template.spec.containers[0].args
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/rophy/opencode-rc/web:0.5.1"
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 8080
            name: http

  - it: uses global imageRegistry
    set:
      global.imageRegistry: harbor.corp.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "harbor.corp.example.com/ghcr.io/rophy/opencode-rc/web:0.5.1"

  - it: uses per-component registry
    set:
      web.image.registry: my-registry.io
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "my-registry.io/ghcr.io/rophy/opencode-rc/web:0.5.1"

  - it: global registry overrides per-component
    set:
      global.imageRegistry: harbor.corp.example.com
      web.image.registry: my-registry.io
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "harbor.corp.example.com/ghcr.io/rophy/opencode-rc/web:0.5.1"

  - it: sets replicas from values
    set:
      web.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: sets COOKIE_SECURE to false in local profile
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COOKIE_SECURE
            value: "false"

  - it: sets COOKIE_SECURE to true in production profile
    set:
      profile: production
      existingSecret: my-secret
      oidc.issuer: https://idp.corp.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COOKIE_SECURE
            value: "true"

  - it: reads OIDC_CLIENT_SECRET from secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-opencode-rc
                key: oidc-client-secret

  - it: reads TOKEN_SECRET from secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOKEN_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-opencode-rc
                key: cookie-secret

  - it: uses existingSecret in production
    set:
      profile: production
      existingSecret: corp-secrets
      oidc.issuer: https://idp.corp.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOKEN_SECRET
            valueFrom:
              secretKeyRef:
                name: corp-secrets
                key: cookie-secret

  - it: sets REDIS_URL inline when redis enabled
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "redis://RELEASE-NAME-opencode-rc-redis:6379/0"

  - it: sets GATEWAY_URL pointing to gateway service
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_URL
            value: "http://RELEASE-NAME-opencode-rc-gateway:9090"

  - it: reads REDIS_URL from secret when redis disabled
    set:
      profile: production
      existingSecret: corp-secrets
      oidc.issuer: https://idp.corp.example.com
      redis.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: corp-secrets
                key: redis-url

  - it: applies tolerations
    set:
      web.tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "web"
          effect: "NoSchedule"
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated

  - it: applies nodeSelector
    set:
      web.nodeSelector:
        tier: frontend
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.tier
          value: frontend

  - it: applies resources
    set:
      web.resources:
        requests:
          cpu: 100m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m

  - it: applies podAnnotations
    set:
      web.podAnnotations:
        prometheus.io/scrape: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  - it: applies podLabels
    set:
      web.podLabels:
        team: platform
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: platform

  - it: applies imagePullSecrets
    set:
      imagePullSecrets:
        - name: corp-registry
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: corp-registry

  - it: applies securityContext
    set:
      web.securityContext:
        runAsNonRoot: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: applies containerSecurityContext
    set:
      web.containerSecurityContext:
        readOnlyRootFilesystem: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: does not set OIDC override env vars by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_OVERRIDE
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_AUTHORIZATION_ENDPOINT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_TOKEN_ENDPOINT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_JWKS_URI

  - it: sets OIDC override env vars when configured
    set:
      oidc.issuerOverride: https://external.idp.example.com
      oidc.authorizationEndpoint: https://external.idp.example.com/authorize
      oidc.tokenEndpoint: https://internal.idp.example.com/token
      oidc.jwksUri: https://internal.idp.example.com/jwks
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_OVERRIDE
            value: "https://external.idp.example.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_AUTHORIZATION_ENDPOINT
            value: "https://external.idp.example.com/authorize"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_TOKEN_ENDPOINT
            value: "https://internal.idp.example.com/token"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_JWKS_URI
            value: "https://internal.idp.example.com/jwks"

  - it: sets only specified OIDC overrides
    set:
      oidc.authorizationEndpoint: https://external.idp.example.com/authorize
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_AUTHORIZATION_ENDPOINT
            value: "https://external.idp.example.com/authorize"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_OVERRIDE
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_TOKEN_ENDPOINT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_JWKS_URI

  - it: does not set TLS_INSECURE_SKIP_VERIFY by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_INSECURE_SKIP_VERIFY
            value: "true"

  - it: sets TLS_INSECURE_SKIP_VERIFY when enabled
    set:
      tlsInsecureSkipVerify: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_INSECURE_SKIP_VERIFY
            value: "true"

  - it: does not mount extra CA certs by default
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
      - isNull:
          path: spec.template.spec.volumes

  - it: mounts extra CA certs and sets NODE_EXTRA_CA_CERTS
    set:
      extraCACerts: "-----BEGIN CERTIFICATE-----\ntest\n-----END CERTIFICATE-----"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_EXTRA_CA_CERTS
            value: "/etc/ssl/certs/extra/ca-bundle.crt"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-ca-certs
            mountPath: /etc/ssl/certs/extra
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-ca-certs
            configMap:
              name: RELEASE-NAME-opencode-rc-extra-ca-certs

  - it: sets token TTL defaults
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ACCESS_TOKEN_TTL
            value: "15m"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SESSION_TTL
            value: "7d"

  - it: sets ALLOWED_ORIGINS when configured
    set:
      auth.allowedOrigins:
        - https://a.example.com
        - https://b.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOWED_ORIGINS
            value: "https://a.example.com,https://b.example.com"

  - it: does not set COOKIE_DOMAIN
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: COOKIE_DOMAIN
          any: true
