suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: creates secret in local profile
    set:
      profile: local
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc
      - equal:
          path: stringData["cookie-secret"]
          value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      - equal:
          path: stringData["oidc-client-secret"]
          value: "opencode-rc-secret"
      - equal:
          path: stringData["redis-url"]
          value: "redis://RELEASE-NAME-opencode-rc-redis:6379/0"

  - it: is absent in production profile
    set:
      profile: production
      existingSecret: corp-secrets
      oidc.issuer: https://idp.corp.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: prefers secrets.tokenSecret over secrets.cookieSecret
    set:
      secrets.tokenSecret: "cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd"
    asserts:
      - equal:
          path: stringData["cookie-secret"]
          value: "cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd"
