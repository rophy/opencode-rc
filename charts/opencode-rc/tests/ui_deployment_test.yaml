suite: ui deployment
templates:
  - templates/ui-deployment.yaml
tests:
  - it: renders the ui deployment with the api URL from the service
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opencode-rc-ui
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/rophy/opencode-rc/ui:0.5.0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_URL
            value: http://RELEASE-NAME-opencode-rc-api:8080

  - it: uses the exposed api URL
    set:
      expose.type: ingress
      expose.host: example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_URL
            value: https://RELEASE-NAME.example.com

  - it: honours expose.scheme http for the api URL
    set:
      expose.type: ingress
      expose.host: example.com
      expose.scheme: http
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_URL
            value: http://RELEASE-NAME.example.com

  - it: is not rendered when ui is disabled
    set:
      ui.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses api.publicUrl for API_URL, trimming a trailing slash
    set:
      api.publicUrl: https://api.rc.example.com/
      expose.type: ingress
      expose.host: example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_URL
            value: https://api.rc.example.com

  - it: fails when ui.publicUrl is set but the api is not exposed
    set:
      ui.publicUrl: https://rc.example.com
    asserts:
      - failedTemplate:
          errorMessage: "ui.publicUrl is set but the API is not reachable by browsers: set expose.type and expose.host, or api.publicUrl"

  - it: accepts ui.publicUrl when api.publicUrl is set
    set:
      ui.publicUrl: https://rc.example.com
      api.publicUrl: https://api.rc.example.com
    asserts:
      - hasDocuments:
          count: 1

  - it: accepts ui.publicUrl when expose is enabled
    set:
      ui.publicUrl: https://rc.example.com
      expose.type: ingress
      expose.host: example.com
    asserts:
      - hasDocuments:
          count: 1

  - it: mounts an emptyDir at /tmp so a read-only root filesystem works
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
