suite: gateway ingress
templates:
  - templates/gateway-ingress.yaml
tests:
  - it: is disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders with WebSocket annotations
    set:
      gateway.ingress.enabled: true
      gateway.ingress.host: gateway.corp.example.com
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-read-timeout"]
          value: "3600"
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-send-timeout"]
          value: "3600"
      - equal:
          path: spec.rules[0].host
          value: gateway.corp.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 9090

  - it: merges user annotations with WebSocket defaults
    set:
      gateway.ingress.enabled: true
      gateway.ingress.host: gateway.corp.example.com
      gateway.ingress.annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-read-timeout"]
          value: "3600"
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-body-size"]
          value: "50m"

  - it: allows user to override WebSocket timeout
    set:
      gateway.ingress.enabled: true
      gateway.ingress.host: gateway.corp.example.com
      gateway.ingress.annotations:
        nginx.ingress.kubernetes.io/proxy-read-timeout: "7200"
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-read-timeout"]
          value: "7200"

  - it: configures TLS
    set:
      gateway.ingress.enabled: true
      gateway.ingress.host: gateway.corp.example.com
      gateway.ingress.tls:
        - secretName: gateway-tls
          hosts:
            - gateway.corp.example.com
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: gateway-tls
