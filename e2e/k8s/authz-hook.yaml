# Stub access webhook. Denies the uids in its deny list (user3 at start) and answers 500
# for the uids in its fail list (empty at start); tests change the lists with
# PUT/DELETE /deny/<uid> and /fail/<uid>.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authz-hook
data:
  hook.js: |
    const http = require("node:http");
    const deny = new Set(["user3"]);
    const fail = new Set();
    http
      .createServer((req, res) => {
        const send = (status, body) => {
          res.writeHead(status, { "content-type": "application/json" });
          res.end(body === undefined ? "" : JSON.stringify(body));
        };
        const list = req.url.match(/^\/(deny|fail)\/([^/]+)$/);
        if (list && (req.method === "PUT" || req.method === "DELETE")) {
          const set = list[1] === "deny" ? deny : fail;
          req.method === "PUT" ? set.add(list[2]) : set.delete(list[2]);
          return send(204);
        }
        if (req.url !== "/check" || req.method !== "POST") return send(404, { error: "not found" });
        if (req.headers.authorization !== "Bearer e2e-hook-token") return send(401, { error: "unauthorized" });
        let raw = "";
        req.on("data", (c) => (raw += c));
        req.on("end", () => {
          const { user } = JSON.parse(raw);
          if (fail.has(user.uid)) {
            console.log(`check uid=${user.uid} failing on purpose`);
            return send(500, { error: "failing on purpose" });
          }
          const allowed = !deny.has(user.uid);
          console.log(`check uid=${user.uid} email=${user.email} allowed=${allowed}`);
          send(200, allowed ? { allowed } : { allowed, reason: "on the e2e deny list" });
        });
      })
      .listen(8080);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz-hook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authz-hook
  template:
    metadata:
      labels:
        app: authz-hook
    spec:
      containers:
        - name: authz-hook
          image: dev-machine
          command: ["node", "/hook/hook.js"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: hook
              mountPath: /hook
              readOnly: true
      volumes:
        - name: hook
          configMap:
            name: authz-hook
---
apiVersion: v1
kind: Service
metadata:
  name: authz-hook
spec:
  selector:
    app: authz-hook
  ports:
    - port: 8080
      targetPort: 8080
