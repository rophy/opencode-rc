apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-machine-config
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    # Wait for OIDC mock
    until curl -sf "${OIDC_URL}/.well-known/openid-configuration" >/dev/null 2>&1; do sleep 1; done

    # Obtain token from OIDC mock via PKCE
    CODE_VERIFIER=$(openssl rand -base64 48 | tr -d '=/+\n' | head -c 43)
    CODE_CHALLENGE=$(printf '%s' "$CODE_VERIFIER" | openssl dgst -sha256 -binary | openssl base64 -e | tr '+/' '-_' | tr -d '=')

    AUTH_CODE_URL=$(curl -sf -o /dev/null -w "%{redirect_url}" -X POST \
      -d "sub=${OIDC_USER_SUB:-user1}&client_id=${OIDC_CLIENT_ID}&redirect_uri=http://127.0.0.1:0/callback&state=docker&nonce=test&scope=openid+email+profile&code_challenge=${CODE_CHALLENGE}&code_challenge_method=S256" \
      "${OIDC_URL}/authorize/callback")
    AUTH_CODE=$(echo "$AUTH_CODE_URL" | sed -n 's/.*code=\([^&]*\).*/\1/p')

    TOKEN_RESP=$(curl -sf -X POST "${OIDC_URL}/token" \
      -d "grant_type=authorization_code&client_id=${OIDC_CLIENT_ID}&code=${AUTH_CODE}&redirect_uri=http://127.0.0.1:0/callback&code_verifier=${CODE_VERIFIER}")
    ID_TOKEN=$(echo "$TOKEN_RESP" | jq -r '.id_token')

    if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
      echo "Failed to obtain token from OIDC mock"
      exit 1
    fi

    export OPENCODE_RC_TOKEN="$ID_TOKEN"
    exec "$@"
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "openai/gpt-4o",
      "provider": {
        "openai": {
          "options": {
            "baseURL": "http://aimock:4010/v1"
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-machine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-machine
  template:
    metadata:
      labels:
        app: dev-machine
    spec:
      containers:
        - name: dev-machine
          image: dev-machine
          command: ["/bin/bash", "/config/entrypoint.sh"]
          args: ["node", "/cli/dist/index.js"]
          env:
            - name: OPENCODE_RC_GATEWAY_URL
              value: "http://opencode-rc-gateway:9090"
            - name: OPENCODE_RC_SESSION_ID
              value: "alice-dev"
            - name: OIDC_ISSUER
              value: "http://opencode-rc-oidc-mock:8080"
            - name: OIDC_URL
              value: "http://opencode-rc-oidc-mock:8080"
            - name: OIDC_CLIENT_ID
              value: "opencode-rc-cli"
            - name: OIDC_USER_SUB
              value: "user1"
            - name: OPENAI_API_KEY
              value: "mock"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: opencode-config
              mountPath: /project/opencode.json
              subPath: opencode.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dev-machine-config
            defaultMode: 0755
        - name: opencode-config
          configMap:
            name: dev-machine-config
            items:
              - key: opencode.json
                path: opencode.json
