# Two self-signed HTTPS servers for testing SSL_CERT_DIR behavior.
# Only the "trusted" CA cert is provided to the test pods via SSL_CERT_DIR.
# Expected: trusted pod fails with OIDC error (not TLS), untrusted pod fails with x509.
#
# Secrets (tls-trusted, tls-untrusted, trusted-ca) are created by run.sh.

# --- HTTPS server with trusted CA cert ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-https-conf
data:
  trusted.conf: |
    server {
      listen 443 ssl;
      ssl_certificate /etc/nginx/certs/tls.crt;
      ssl_certificate_key /etc/nginx/certs/tls.key;
      location / { return 404 '{"error":"not found"}'; }
    }
  untrusted.conf: |
    server {
      listen 443 ssl;
      ssl_certificate /etc/nginx/certs/tls.crt;
      ssl_certificate_key /etc/nginx/certs/tls.key;
      location / { return 404 '{"error":"not found"}'; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: https-trusted
spec:
  replicas: 1
  selector:
    matchLabels:
      app: https-trusted
  template:
    metadata:
      labels:
        app: https-trusted
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 443
          volumeMounts:
            - name: certs
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: trusted.conf
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: tls-trusted
        - name: conf
          configMap:
            name: nginx-https-conf
---
apiVersion: v1
kind: Service
metadata:
  name: https-trusted
spec:
  selector:
    app: https-trusted
  ports:
    - port: 443
      targetPort: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: https-untrusted
spec:
  replicas: 1
  selector:
    matchLabels:
      app: https-untrusted
  template:
    metadata:
      labels:
        app: https-untrusted
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 443
          volumeMounts:
            - name: certs
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: untrusted.conf
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: tls-untrusted
        - name: conf
          configMap:
            name: nginx-https-conf
---
apiVersion: v1
kind: Service
metadata:
  name: https-untrusted
spec:
  selector:
    app: https-untrusted
  ports:
    - port: 443
      targetPort: 443
---
# Test pod: gateway with trusted CA in SSL_CERT_DIR
# Should fail with OIDC discovery error (404), NOT x509
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-test-trusted
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tls-test-trusted
  template:
    metadata:
      labels:
        app: tls-test-trusted
    spec:
      containers:
        - name: gateway
          image: opencode-rc-backend
          args: ["gateway"]
          env:
            - name: OIDC_ISSUER
              value: "https://https-trusted"
            - name: OIDC_CLIENT_ID
              value: "test"
            - name: OIDC_REDIRECT_URI
              value: "http://localhost/callback"
            - name: COOKIE_SECRET
              value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
            - name: REDIS_URL
              value: "redis://opencode-rc-redis:6379/1"
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/etc/ssl/certs/extra"
          volumeMounts:
            - name: trusted-ca
              mountPath: /etc/ssl/certs/extra
              readOnly: true
      volumes:
        - name: trusted-ca
          secret:
            secretName: trusted-ca
---
# Test pod: gateway WITHOUT the untrusted CA in SSL_CERT_DIR
# Should fail with x509 certificate error
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-test-untrusted
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tls-test-untrusted
  template:
    metadata:
      labels:
        app: tls-test-untrusted
    spec:
      containers:
        - name: gateway
          image: opencode-rc-backend
          args: ["gateway"]
          env:
            - name: OIDC_ISSUER
              value: "https://https-untrusted"
            - name: OIDC_CLIENT_ID
              value: "test"
            - name: OIDC_REDIRECT_URI
              value: "http://localhost/callback"
            - name: COOKIE_SECRET
              value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
            - name: REDIS_URL
              value: "redis://opencode-rc-redis:6379/1"
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs"
          # No extra CA volume mounted
