apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aimock
  template:
    metadata:
      labels:
        app: aimock
    spec:
      containers:
        - name: aimock
          image: ghcr.io/copilotkit/aimock:1.42.0
          args: ["-h", "0.0.0.0", "-f", "/fixtures"]
          ports:
            - containerPort: 4010
          volumeMounts:
            - name: fixtures
              mountPath: /fixtures
              readOnly: true
      volumes:
        - name: fixtures
          configMap:
            name: aimock-fixtures
---
apiVersion: v1
kind: Service
metadata:
  name: aimock
spec:
  selector:
    app: aimock
  ports:
    - port: 4010
      targetPort: 4010
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimock-fixtures
data:
  echo.json: |
    {
      "fixtures": [
        {
          "match": {},
          "response": {
            "content": "Hello from aimock! The e2e test is working."
          }
        }
      ]
    }
