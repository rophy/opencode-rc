apiVersion: skaffold/v4beta12
kind: Config
metadata:
  name: opencode-rc-e2e
build:
  local:
    push: false
  artifacts:
    - image: opencode-rc-web
      context: ..
      docker:
        dockerfile: web/Dockerfile
    - image: opencode-rc-gateway
      context: ..
      docker:
        dockerfile: gateway/Dockerfile
        buildArgs:
          COVER: "true"
    - image: dev-machine
      context: ..
      docker:
        dockerfile: cli/Dockerfile
manifests:
  rawYaml:
    - k8s/aimock.yaml
    - k8s/dev-machine.yaml
deploy:
  kubectl: {}
  helm:
    releases:
      - name: opencode-rc
        chartPath: ../charts/opencode-rc
        setValues:
          fullnameOverride: opencode-rc
          web.image.pullPolicy: Never
          gateway.image.pullPolicy: Never
          oidcMock.image.pullPolicy: IfNotPresent
          redis.image.pullPolicy: IfNotPresent
        setValueTemplates:
          web.image.registry: ""
          web.image.repository: "{{.IMAGE_REPO_opencode_rc_web}}"
          web.image.tag: "{{.IMAGE_TAG_opencode_rc_web}}"
          gateway.image.registry: ""
          gateway.image.repository: "{{.IMAGE_REPO_opencode_rc_gateway}}"
          gateway.image.tag: "{{.IMAGE_TAG_opencode_rc_gateway}}"
profiles:
  - name: dev
    patches:
      - op: replace
        path: /build/artifacts/1/docker/buildArgs
        value: {}
      - op: replace
        path: /manifests/rawYaml
        value:
          - k8s/aimock.yaml
          - k8s/dev-machine.yaml
      - op: add
        path: /deploy/helm/releases/0/valuesFiles
        value:
          - ../.local/values-dev.yaml
