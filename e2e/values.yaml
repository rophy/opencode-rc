# Chart values for the e2e environment (on top of skaffold's setValues).
oidcMock:
  users:
    - sub: user1
      email: alice@example.com
      name: Alice
    - sub: user2
      email: bob@example.com
      name: Bob
    # Signs in, but the stub access webhook (k8s/authz-hook.yaml) denies her.
    - sub: user3
      email: carol@example.com
      name: Carol
authz:
  webhook:
    url: http://authz-hook:8080/check
    tokenSecret:
      name: authz-hook-token
  # Short, so the e2e tests see open streams re-checked quickly.
  cacheTTL:
    allowed: 5s
admin:
  tokenSecret:
    name: opencode-rc-admin
# Same features as e2e/rc-config.json, which the UI image is built from (except terminal, which
# stays enabled here so the terminal-enabled tests run).
config:
  features:
    uploads:
      enabled: false
    downloads:
      enabled: false
  opencodeV2:
    features:
      uploads:
        enabled: false
      downloads:
        enabled: false
