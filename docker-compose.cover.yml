services:
  gateway:
    build:
      args:
        COVER: "true"
    environment:
      GOCOVERDIR: /coverdata
    volumes:
      - ./.cover/gateway:/coverdata

  tunneler:
    build:
      args:
        COVER: "true"
    environment:
      GOCOVERDIR: /coverdata
    volumes:
      - ./.cover/tunneler:/coverdata

  dev-machine:
    environment:
      NODE_V8_COVERAGE: /coverdata
    volumes:
      - ./.cover/cli:/coverdata
