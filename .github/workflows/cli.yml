name: CLI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
  pull_request:
    paths:
      - 'cli/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for staged publishing
        run: npm install -g npm@latest

      - name: Check if version exists on npm
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          if npm view opencode-rc@$LOCAL version 2>/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and stage publish
        if: steps.check.outputs.publish == 'true'
        run: |
          npm ci
          npm run build
          npm stage publish --access public

      - name: Tag release
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "cli/${{ steps.check.outputs.version }}"
          git push origin "cli/${{ steps.check.outputs.version }}"
