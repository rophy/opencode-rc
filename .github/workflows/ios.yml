name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'config/**'
      - 'vendor/opencode'
      - 'vendor/patches/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Every run builds and tests the app; only a version that has no tag yet is published.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v5

      - name: Read iOS version
        id: version
        run: |
          PBXPROJ=ui/ios/App/App.xcodeproj/project.pbxproj
          MARKETING=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' "$PBXPROJ" | head -1 | tr -d ' ')
          BUILD=$(sed -n 's/.*CURRENT_PROJECT_VERSION = \(.*\);/\1/p' "$PBXPROJ" | head -1 | tr -d ' ')
          VERSION="${MARKETING}-${BUILD}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The checkout has no tags, so ask the remote.
          if git ls-remote --exit-code --tags origin "refs/tags/ios/$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Tag ios/$VERSION exists, nothing to publish"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New version: $VERSION"
          fi

  build:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Install submodule deps
        run: cd vendor/opencode && bun install --frozen-lockfile

      - name: Build SPA
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Sync iOS project
        run: cd ui && npx cap sync ios

      # Copy the synced project before Xcode writes its build state into it.
      - name: Prepare releases/ios
        if: needs.version.outputs.new == 'true'
        run: |
          mkdir /tmp/ios-publish
          cp -r ui/ios/. /tmp/ios-publish/
          cp LICENSE /tmp/ios-publish/
          rm -f /tmp/ios-publish/.gitignore

      # Unsigned, in the Simulator: compiles the app and runs the launch smoke test (AppUITests).
      - name: Build and test
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$UDID" && test "$UDID" != null
          cd ui/ios/App
          xcodebuild test -project App.xcodeproj -scheme App -configuration Debug \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO

      - name: Publish to releases/ios
        if: needs.version.outputs.new == 'true'
        run: |
          cd /tmp/ios-publish
          git init -b releases/ios
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "build: update iOS project from ${GITHUB_SHA::8}"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin releases/ios

      - name: Tag release
        if: needs.version.outputs.new == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "ios/${{ needs.version.outputs.version }}"
          git push origin "ios/${{ needs.version.outputs.version }}"
