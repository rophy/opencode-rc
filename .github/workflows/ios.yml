name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'config/**'
      - 'vendor/opencode'
      - 'vendor/patches/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Builds and publishes only a version that has no tag yet.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v5

      - name: Read iOS version
        id: version
        run: |
          PBXPROJ=ui/ios/App/App.xcodeproj/project.pbxproj
          MARKETING=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' "$PBXPROJ" | head -1 | tr -d ' ')
          BUILD=$(sed -n 's/.*CURRENT_PROJECT_VERSION = \(.*\);/\1/p' "$PBXPROJ" | head -1 | tr -d ' ')
          VERSION="${MARKETING}-${BUILD}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The checkout has no tags, so ask the remote.
          if git ls-remote --exit-code --tags origin "refs/tags/ios/$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Tag ios/$VERSION exists, nothing to build"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New version: $VERSION"
          fi

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Install submodule deps
        run: cd vendor/opencode && bun install --frozen-lockfile

      - name: Build SPA
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Sync iOS project
        run: cd ui && npx cap sync ios

      # Unsigned, so it runs only in the iOS Simulator (xcrun simctl install booted App.app).
      - name: Build debug app for the simulator
        run: |
          cd ui/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/App.app.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: opencode-rc-ios-${{ needs.version.outputs.version }}-simulator
          path: ${{ runner.temp }}/App.app.zip
          if-no-files-found: error

      - name: Publish to releases/ios
        run: |
          cd /tmp
          mkdir ios-publish && cd ios-publish
          git init -b releases/ios
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          cp -r $GITHUB_WORKSPACE/ui/ios/. .
          cp $GITHUB_WORKSPACE/LICENSE .
          rm -f .gitignore
          # Written by the simulator build; Package.swift already pins Capacitor exactly.
          rm -rf App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm

          git add -A
          git commit -m "build: update iOS project from ${GITHUB_SHA::8}"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin releases/ios

      - name: Tag release
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "ios/${{ needs.version.outputs.version }}"
          git push origin "ios/${{ needs.version.outputs.version }}"
