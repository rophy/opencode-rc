name: Gateway

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gateway/Dockerfile
          push: false
          tags: opencode-rc-gateway:test
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  publish:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check if version exists on ghcr.io
        id: check
        run: |
          VERSION=$(cat gateway/VERSION | tr -d '[:space:]')
          if docker manifest inspect ghcr.io/${{ github.repository }}/gateway:$VERSION > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Gateway $VERSION already exists, skipping publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: steps.check.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        if: steps.check.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/gateway:${{ steps.check.outputs.version }}
            ghcr.io/${{ github.repository }}/gateway:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Tag release
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "gateway/${{ steps.check.outputs.version }}"
          git push origin "gateway/${{ steps.check.outputs.version }}"
