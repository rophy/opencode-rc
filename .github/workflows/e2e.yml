name: E2E

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'gateway/**'
      - 'ui/**'
      - 'vendor/opencode'
      - 'e2e/**'
      - 'cli/**'
      - 'charts/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'gateway/**'
      - 'ui/**'
      - 'vendor/opencode'
      - 'e2e/**'
      - 'cli/**'
      - 'charts/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: opencode-rc-e2e
          config: e2e/kind-config.yaml

      - name: Install Skaffold
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/

      - name: Generate TLS test certs
        run: |
          CERT_DIR=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -keyout "$CERT_DIR/ca1.key" -out "$CERT_DIR/ca1.crt" \
            -days 1 -nodes -subj "/CN=Trusted CA" 2>/dev/null
          openssl req -newkey rsa:2048 -keyout "$CERT_DIR/srv1.key" -out "$CERT_DIR/srv1.csr" \
            -nodes -subj "/CN=https-trusted" \
            -addext "subjectAltName=DNS:https-trusted,DNS:https-trusted.default.svc.cluster.local" 2>/dev/null
          openssl x509 -req -in "$CERT_DIR/srv1.csr" -CA "$CERT_DIR/ca1.crt" -CAkey "$CERT_DIR/ca1.key" \
            -CAcreateserial -out "$CERT_DIR/srv1.crt" -days 1 -copy_extensions copyall 2>/dev/null

          openssl req -x509 -newkey rsa:2048 -keyout "$CERT_DIR/ca2.key" -out "$CERT_DIR/ca2.crt" \
            -days 1 -nodes -subj "/CN=Untrusted CA" 2>/dev/null
          openssl req -newkey rsa:2048 -keyout "$CERT_DIR/srv2.key" -out "$CERT_DIR/srv2.csr" \
            -nodes -subj "/CN=https-untrusted" \
            -addext "subjectAltName=DNS:https-untrusted,DNS:https-untrusted.default.svc.cluster.local" 2>/dev/null
          openssl x509 -req -in "$CERT_DIR/srv2.csr" -CA "$CERT_DIR/ca2.crt" -CAkey "$CERT_DIR/ca2.key" \
            -CAcreateserial -out "$CERT_DIR/srv2.crt" -days 1 -copy_extensions copyall 2>/dev/null

          kubectl create secret tls tls-trusted --cert="$CERT_DIR/srv1.crt" --key="$CERT_DIR/srv1.key"
          kubectl create secret tls tls-untrusted --cert="$CERT_DIR/srv2.crt" --key="$CERT_DIR/srv2.key"
          kubectl create secret generic trusted-ca --from-file=ca.crt="$CERT_DIR/ca1.crt"
          rm -rf "$CERT_DIR"

      - name: Pre-load external images into kind
        run: |
          for img in ghcr.io/copilotkit/aimock:1.42.0 nginx:1.27-alpine; do
            docker pull "$img"
            kind load docker-image "$img" --name opencode-rc-e2e
          done

      - name: Build and deploy
        run: cd e2e && skaffold run -n default

      - name: Wait for api
        run: kubectl wait --for=condition=Available deployment/opencode-rc-api --timeout=120s

      - name: Wait for dev-machine
        run: kubectl wait --for=condition=Available deployment/dev-machine --timeout=120s

      - name: Run vitest e2e tests
        run: |
          DEV_POD=$(kubectl get pod -l app=dev-machine -o jsonpath='{.items[0].metadata.name}')
          for i in $(seq 1 60); do
            if kubectl exec "$DEV_POD" -- curl -sf http://opencode-rc-api:8080/healthz > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          kubectl exec "$DEV_POD" -- sh -c \
            "cd /e2e && API_URL=http://opencode-rc-api:8080 GATEWAY_URL=http://opencode-rc-gateway:9090 OIDC_URL=http://opencode-rc-oidc-mock:8080 npx vitest run"

      - name: Run playwright e2e tests
        run: |
          DEV_POD=$(kubectl get pod -l app=dev-machine -o jsonpath='{.items[0].metadata.name}')
          kubectl exec "$DEV_POD" -- sh -c \
            "cd /e2e && API_URL=http://opencode-rc-api:8080 npx playwright test --config playwright.config.ts"

      - name: Show logs on failure
        if: failure()
        run: |
          kubectl logs deployment/opencode-rc-api --tail=50 || true
          kubectl logs deployment/opencode-rc-gateway --tail=50 || true
          kubectl logs deployment/dev-machine --tail=50 || true
          kubectl logs deployment/tls-test-trusted --tail=20 || true
          kubectl logs deployment/tls-test-untrusted --tail=20 || true
