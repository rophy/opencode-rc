name: Android

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'config/**'
      - 'vendor/opencode-v1'
      - 'vendor/opencode-v2'
      - 'vendor/patches/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Every run compiles the app; only a version that has no tag yet is published.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v5

      - name: Read Android version
        id: version
        run: |
          GRADLE=ui/android/app/build.gradle
          NAME=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' "$GRADLE" | head -1)
          CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' "$GRADLE" | head -1)
          VERSION="${NAME}-${CODE}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The checkout has no tags, so ask the remote.
          if git ls-remote --exit-code --tags origin "refs/tags/android/$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Tag android/$VERSION exists, nothing to publish"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New version: $VERSION"
          fi

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Bun 1.4.4 cannot apply opencode's photon-node patch; unpin when fixed.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # Vite runs on Node; pin it so the build doesn't depend on the runner's default.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install submodule deps (1.x)
        run: cd vendor/opencode-v1 && bun install --frozen-lockfile

      - name: Install submodule deps (2.x)
        run: cd vendor/opencode-v2 && bun install --frozen-lockfile --ignore-scripts

      - name: Build SPA
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Sync Android project
        run: cd ui && bun run sync:android

      # Copy the synced project before Gradle writes its build output into it.
      - name: Prepare releases/android
        if: needs.version.outputs.new == 'true'
        run: |
          mkdir /tmp/android-publish
          cp -r ui/android/. /tmp/android-publish/
          cp LICENSE /tmp/android-publish/
          cd /tmp/android-publish
          # Keep the web app that `sync:android` copied in (the template ignores it).
          sed -i '/^# Copied web assets/,$d' .gitignore
          ! grep -q 'assets/public' .gitignore

      # A compile check only; the APK is not published.
      - name: Build debug APK
        run: cd ui/android && ./gradlew test assembleDebug

      - name: Publish to releases/android
        if: needs.version.outputs.new == 'true'
        run: |
          cd /tmp/android-publish
          git init -b releases/android
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "build: update Android project from ${GITHUB_SHA::8}"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin releases/android

      - name: Tag release
        if: needs.version.outputs.new == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "android/${{ needs.version.outputs.version }}"
          git push origin "android/${{ needs.version.outputs.version }}"
