services:
  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", ""]

  oidc-mock:
    image: ghcr.io/rophy/oidc-mock:20260907-dfef1a3
    command: ["serve"]
    environment:
      OIDC_CONFIG: |
        port: 8080
        issuer: ${OIDC_ISSUER:-http://oidc-mock:8080}
        clients:
          - id: ${OIDC_CLIENT_ID:-opencode-rc}
            secret: ${OIDC_CLIENT_SECRET:-opencode-rc-secret}
            redirect_uris:
              - http://gateway:8080/auth/callback
              - ${OIDC_REDIRECT_URI:-http://gateway:8080/auth/callback}
          - id: opencode-rc-cli
            redirect_uris:
              - http://127.0.0.1:0/callback
        users:
          - sub: user1
            email: alice@example.com
            name: Alice
          - sub: user2
            email: bob@example.com
            name: Bob

  aimock:
    image: ghcr.io/copilotkit/aimock
    command: ["-h", "0.0.0.0", "-f", "/fixtures"]
    volumes:
      - ./compose/aimock/fixtures:/fixtures:ro

  tunneler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["tunneler"]
    environment:
      PORT: "9090"
      POD_IP: tunneler
      REDIS_URL: redis://redis:6379/0
      OIDC_ISSUER: ${OIDC_ISSUER:-http://oidc-mock:8080}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-opencode-rc}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-opencode-rc-secret}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://gateway:8080/auth/callback}
      COOKIE_SECRET: ${COOKIE_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      OIDC_CLI_CLIENT_ID: opencode-rc-cli
    depends_on:
      - oidc-mock
      - redis

  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["gateway"]
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379/0
      OIDC_ISSUER: ${OIDC_ISSUER:-http://oidc-mock:8080}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-opencode-rc}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-opencode-rc-secret}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://gateway:8080/auth/callback}
      COOKIE_SECRET: ${COOKIE_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OIDC_CLI_CLIENT_ID: opencode-rc-cli
    depends_on:
      - oidc-mock
      - redis
      - tunneler

  dev-machine:
    profiles: ["rc"]
    build:
      context: .
      dockerfile: cli/Dockerfile
    entrypoint: ["/bin/bash", "/rc-entrypoint.sh"]
    command: ["node", "/cli/dist/index.js"]
    restart: unless-stopped
    volumes:
      - ./compose/rc-client/entrypoint.sh:/rc-entrypoint.sh:ro
      - ./compose/rc-client/opencode.json:/project/opencode.json:ro
      - ./e2e:/e2e
    environment:
      OPENCODE_RC_GATEWAY_URL: http://tunneler:9090
      OPENCODE_RC_SESSION_ID: ${OPENCODE_RC_SESSION_ID:-alice-dev}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://oidc-mock:8080}
      OIDC_URL: ${OIDC_ISSUER:-http://oidc-mock:8080}
      OIDC_CLIENT_ID: opencode-rc-cli
      OIDC_USER_SUB: ${OIDC_USER_SUB:-user1}
      OPENAI_API_KEY: mock
    depends_on:
      - tunneler
      - aimock
